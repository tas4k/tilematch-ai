
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TileMatch AI</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 20px;
  background: #101522;
  color: white;
  font-family: Arial, sans-serif;
}
main { max-width: 500px; margin: auto; }
h1 { text-align: center; color: #65e6b2; }
.panel {
  background: #1c2638;
  padding: 18px;
  border-radius: 14px;
  margin-top: 20px;
}
p { color: #c5ccda; line-height: 1.5; }
input, button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border-radius: 9px;
  font-size: 16px;
}
button {
  border: 0;
  background: #65e6b2;
  color: #101522;
  font-weight: bold;
}
button:disabled { opacity: .5; }
img {
  display: none;
  width: 100%;
  margin-top: 15px;
  border-radius: 10px;
}
#status { color: #65e6b2; }
#result {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  margin-top: 16px;
  color: #65e6b2;
}
</style>
</head>
<body>
<main>
  <h1>TileMatch AI</h1>
  <p style="text-align:center">
    Your screenshot-based tile puzzle assistant
  </p>

  <section class="panel">
    <p id="status">Reader ready</p>

    <p>1. Take a screenshot of your Tile Match Ultimate board.</p>
    <p>2. Select the screenshot below.</p>

    <input id="photo" type="file" accept="image/*">

    <img id="preview" alt="Game screenshot preview">

    <button id="analyze">Analyze My Board</button>

    <div id="result">
      Your move suggestions will appear here.
    </div>
  </section>
</main>

<script>
const WORKER_URL =
  "https://tilematch-ai-reader.tagdemtas.workers.dev";

const photo = document.getElementById("photo");
const preview = document.getElementById("preview");
const analyze = document.getElementById("analyze");
const result = document.getElementById("result");
const statusText = document.getElementById("status");

let selectedImage = null;

photo.addEventListener("change", () => {
  const file = photo.files[0];

  if (!file) return;

  selectedImage = file;
  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";

  result.textContent = "Screenshot selected. Ready to analyze.";
});

analyze.addEventListener("click", async () => {
  if (!selectedImage) {
    result.textContent = "Please select a screenshot first.";
    return;
  }

  analyze.disabled = true;
  statusText.textContent = "Sending screenshot...";
  result.textContent = "Please wait while the board is analyzed.";

  try {
    const imageData = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(reader.error);
      reader.readAsDataURL(selectedImage);
    });

    statusText.textContent = "Analyzing board...";

    const response = await fetch(WORKER_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        image: imageData,
        prompt: "Analyze this Tile Match Ultimate game screenshot. Identify visible tiles, their positions, and the best safe moves. The tray holds 7 tiles and matches are made with 3 identical tiles. Clearly explain any uncertainty."
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Reader returned an error.");
    }

    result.textContent =
      data.result || data.response || JSON.stringify(data, null, 2);

    statusText.textContent = "Analysis received";

  } catch (error) {
    statusText.textContent = "Connection needs attention";
    result.textContent =
      "Could not analyze the screenshot: " + error.message;
  } finally {
    analyze.disabled = false;
  }
});
</script>
</body>
</html>
